<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相片沖印價目表｜群美彩色攝影沖印社</title>
<meta name="description" content="群美照相館洗相片尺寸與價格：2x3 到 12x18，各種尺寸沖印價格一覽">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<nav class="top-nav"><div class="container top-nav-inner" id="top-nav"><a class="top-nav-link" href="../index.html">首頁</a></div></nav>

<header class="site-header">
  <div class="container">
    <h1 class="shop-name">相片沖印價目表</h1>
    <p class="shop-tagline">群美相館</p>
  </div>
</header>

<div class="container">
  <p class="breadcrumb"><a href="../index.html">← 回首頁</a></p>

  <section class="order-info">
    <h2 class="order-info-title">📸 群美相片沖洗，三步驟搞定！</h2>
    <ol>
      <li><strong>加好友</strong> ➔ LINE 搜尋「群美」或輸入 ID：02357301</li>
      <li><strong>傳照片</strong> ➔ 請在 LINE 建立相簿上傳照片</li>
      <li><strong>留資料</strong> ➔ 傳完後請留言告知：【姓名 / 電話 / 沖洗尺寸】</li>
    </ol>
    <p>我們將陸續為您安排收件。<strong>【急件請來電告知】</strong>，感謝您的配合！</p>
  </section>

  <h2 class="section-title">洗相片</h2>
  <div class="table-wrap">
    <table class="price-table">
      <thead>
        <tr>
          <th>尺寸</th>
          <th>實際尺寸</th>
          <th>備註</th>
          <th>價格</th>
        </tr>
      </thead>
      <tbody id="price-table-body"></tbody>
    </table>
  </div>

  <div class="size-chart-gallery">
    <img src="../assets/images/photo-printing/size-chart-full.jpg" alt="洗相片尺寸示意圖（完整版）" loading="lazy">
    <img src="../assets/images/photo-printing/size-chart-small-sizes.jpg" alt="洗相片尺寸示意圖（小尺寸）" loading="lazy">
  </div>

  <h2 class="section-title">拍立得底片</h2>
  <div class="instax-card">
    <img src="../assets/images/photo-printing/instax-mini.jpg" alt="FUJIFILM instax mini 拍立得底片">
    <div class="instax-info">
      <p class="instax-name">FUJIFILM instax mini 拍立得底片</p>
      <p class="instax-note">價格與現貨請來電洽詢：<a href="tel:0492357301">049-2357301</a></p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <p>價格如有調整以店內現場公告為準。如有疑問歡迎來電洽詢：049-2357301</p>
  </div>
</footer>

<script src="../assets/js/main.js"></script>
<script>
  loadJson("../data/categories.json").then((categories) => {
    renderTopNav(categories, document.getElementById("top-nav"), "../");
  });
  loadJson("../data/photo-printing.json").then((rows) => {
    renderPriceTable(rows, document.getElementById("price-table-body"));
  });
</script>
</body>
</html>
